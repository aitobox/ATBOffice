[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atboffice"
version = "0.4.0"
description = "A cross-platform office suite built with PySide6"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "lxml>=5.2",
    "msoffcrypto-tool>=5.4",
    "packaging>=23.0",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-xdist>=3.5",
    "mypy>=1.10",
    "ruff>=0.6",
    "pyyaml>=6.0",
]

[project.scripts]
atboffice = "atboffice.__main__:main"
atboffice-quire = "atboffice.__main__:main_quire"
atboffice-ledger = "atboffice.__main__:main_ledger"
atboffice-lectern = "atboffice.__main__:main_lectern"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Locale catalogs, fonts and dictionaries ship inside the package.
atboffice = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --import-mode=importlib"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# CI type-checks src/atboffice/core; other packages are followed silently.
follow_imports = "silent"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
