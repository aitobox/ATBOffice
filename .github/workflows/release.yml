name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'test*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 0.1.0, v1.0.0, test1.0.0)'
        required: true
        default: 'test1.0.0'
        type: string
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - linux
          - windows
      publish_release:
        description: 'Publish as GitHub Release (if false, only stores workflow artifacts)'
        required: true
        type: boolean
        default: true

jobs:
  build-macos:
    name: Build macOS ARM DMG
    runs-on: macos-14
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka zstandard pyside6 cryptography

      - name: Build and Sign macOS DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_CERTS_P12_BASE64: ${{ secrets.MAC_CERTS_P12_BASE64 }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          MAC_PROVISION_PROFILE_BASE64: ${{ secrets.MAC_PROVISION_PROFILE_BASE64 }}
        run: |
          python scripts/build/build_macos.py --strict-signing --output-dir dist --version "${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 fuse file wget

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka zstandard pyside6 cryptography

      - name: Prepare appimagetool
        run: |
          mkdir -p build/tools
          wget -q -O build/tools/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x build/tools/appimagetool
          cd build/tools && ./appimagetool --appimage-extract

      - name: Build Linux AppImage
        run: |
          python scripts/build/build_linux.py --appimagetool build/tools/squashfs-root/AppRun --output-dir dist --version "${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  build-windows:
    name: Build Windows Portable ZIP
    runs-on: windows-latest
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka zstandard pyside6 cryptography

      - name: Build Windows Portable ZIP
        run: |
          python scripts/build/build_windows.py --output-dir dist --version "${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      always() &&
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: List downloaded release assets
        run: |
          ls -la release_assets/

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ startsWith(github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name, 'test') }}
          generate_release_notes: true
          name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
