name: Full Corpus Audit

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit number of files to audit (leave empty for all 6,200+ files)'
        required: false
        default: ''
      timeout:
        description: 'Per-file timeout in seconds'
        required: false
        default: '30'
  schedule:
    # Run weekly every Monday at 02:00 UTC
    - cron: '0 2 * * 1'

jobs:
  corpus-audit:
    name: Batch Compatibility & Loss Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -el {0}

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          activate-environment: ATBOffice
          auto-activate-base: false
          auto-update-conda: true
          channels: conda-forge,defaults

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Install dependencies from pyproject.toml
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Cache Full Corpus Data
        id: cache-corpora
        uses: actions/cache@v4
        with:
          path: ~/.cache/atboffice_corpora
          key: office-full-corpora-v1-${{ hashFiles('scripts/fetch_corpora.py') }}
          restore-keys: |
            office-full-corpora-v1-

      - name: Fetch and Link Full Corpus
        run: |
          python scripts/fetch_corpora.py --dest tests/docs/full_corpus

      - name: Run Multi-process Corpus Batch Audit
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ -n "${{ github.event.inputs.timeout }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --timeout ${{ github.event.inputs.timeout }}"
          fi
          python scripts/run_corpus_audit.py \
            --corpus-dir tests/docs/full_corpus \
            --workers 4 \
            $EXTRA_ARGS \
            --output audit_report.jsonl

      - name: Upload Audit Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-audit-report
          path: audit_report.jsonl
          retention-days: 14
