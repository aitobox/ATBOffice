name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - 'test*'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  matrix-prep:
    name: Determine Test Matrix
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.set-matrix.outputs.os }}
    steps:
      - name: Evaluate runner OS matrix
        id: set-matrix
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo 'os=["ubuntu-latest", "macos-latest", "windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: matrix-prep
    runs-on: ${{ matrix.os }}
    if: |
      github.event_name != 'push' || 
      (
        !startsWith(github.event.head_commit.message, 'Merge pull request') &&
        !startsWith(github.event.head_commit.message, 'Merge branch') &&
        !contains(github.event.head_commit.message, '(#')
      )
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.matrix-prep.outputs.os) }}
        python-version: ["3.12"]

    defaults:
      run:
        shell: bash -el {0}

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: ATBOffice
          auto-activate-base: false
          auto-update-conda: true
          channels: conda-forge,defaults

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
          for i in {1..3}; do sudo apt-get update && break || sleep 5; done
          sudo apt-get install --yes --no-install-recommends libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Install dependencies from pyproject.toml
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests with pytest
        run: pytest
